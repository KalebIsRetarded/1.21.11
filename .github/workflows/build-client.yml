
name: Build Deepslate Client

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build browser client
        run: ./gradlew makeMainOfflineDownload --no-daemon

      - name: Save browser client files
        uses: actions/upload-artifact@v4
        with:
          name: deepslate-client
          path: target_teavm_javascript/javascript/
          if-no-files-found: error
          retention-days: 7
