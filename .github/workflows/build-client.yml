name: Build Deepslate Client

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build browser client
        run: ./gradlew :teavm:generateJavaScript --no-daemon

      - name: Show generated files
        run: find teavm/build -type f | head -100

      - name: Save browser client build
        uses: actions/upload-artifact@v4
        with:
          name: deepslate-client
          path: teavm/build/
          if-no-files-found: error
          retention-days: 7
